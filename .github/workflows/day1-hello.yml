#Day 1 Lab 1 - you first robot recipe
name: Day 1 - Hello Actions

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
        greeting:
            description: Who should the robot greet?
            required: true
            type: string

jobs:
    say-hello:
        runs-on: ubuntu-latest
        steps:
            - name: Greet
              run: echo "Hello ${{ github.event.inputs.greeting }} from a push!"

            - name: Show a few contexts
              env:
                EVENT: ${{ github.event_name }}
                ACTOR: ${{ github.actor }}
                SHA: ${{ github.sha }}
                RUNNER_OS: ${{ runner.os }}
              run: |
                echo "Event: $EVENT"
                echo "Actor: $ACTOR"
                echo "SHA: $SHA"
                echo "Runner OS:  $RUNNER_OS"

            - name: Show runner name and IP
              run: |
                echo "Runner name: $(hostname)"
                echo "Runner IP: $(curl -s https://api.ipify.org)"
                . /etc/os-release
                echo "OS: $PRETTY_NAME"
                echo "Kernel version: $(uname -r)"

            - name: Write to the run summary
              run: |
                echo "Hello from run ${{ github.run_number }} :wave:" >> $GITHUB_STEP_SUMMARY
    
    on-windows:
        needs: say-hello
        runs-on: windows-latest
        steps:
            - name: Same diea, Powershell this time
              shell: pwsh
              run: 'Write-Host "Powershell: $($PSVersionTable.PSVersion) on $env:RUNNER_OS!"'

            - name: Show runner name and IP
              shell: pwsh
              run: |
                Write-Host "Runner name: $env:COMPUTERNAME"
                Write-Host "Runner IP: $(Invoke-RestMethod https://api.ipify.org)"
                $os = Get-CimInstance Win32_OperatingSystem
                Write-Host "OS: $($os.Caption)"
                Write-Host "OS version: $($os.Version)"
