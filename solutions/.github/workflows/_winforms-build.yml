# Day 2 · Lab 1 — reusable: restore, test, publish and zip the WinForms app on Windows
name: Reusable - WinForms build

on:
  workflow_call:
    inputs:
      version:
        type: string
        required: true
    outputs:
      artifact-name:
        value: ${{ jobs.build.outputs.artifact-name }}

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    outputs:
      artifact-name: PositionSizer-${{ inputs.version }}
    defaults:
      run:
        shell: pwsh
        working-directory: winforms-app
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore PositionSizer.sln

      - name: Build
        run: dotnet build PositionSizer.sln -c Release --no-restore -p:Version=${{ inputs.version }}

      - name: Test
        run: dotnet test PositionSizer.sln -c Release --no-build --logger "trx;LogFileName=results.trx" --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: winforms-test-results-${{ inputs.version }}
          path: winforms-app/TestResults

      - name: Publish (framework-dependent, win-x64)
        run: >
          dotnet publish src/PositionSizer.App/PositionSizer.App.csproj
          -c Release -r win-x64 --self-contained false
          -p:Version=${{ inputs.version }}
          -o publish

      - name: Zip it
        run: Compress-Archive -Path publish/* -DestinationPath PositionSizer-${{ inputs.version }}.zip

      - uses: actions/upload-artifact@v7
        with:
          name: PositionSizer-${{ inputs.version }}
          path: winforms-app/PositionSizer-${{ inputs.version }}.zip
          if-no-files-found: error
