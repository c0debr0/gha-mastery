# Day 3 · Lab 4 — tag v1.2.3 -> build both apps -> GitHub Release -> WinForms download site on Azure Storage
name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - id: v
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

  java:
    needs: meta
    uses: ./.github/workflows/_maven-build.yml
    with:
      version: ${{ needs.meta.outputs.version }}

  winforms:
    needs: meta
    uses: ./.github/workflows/_winforms-build.yml
    with:
      version: ${{ needs.meta.outputs.version }}

  github-release:
    needs: [meta, java, winforms]
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to create the release
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: ${{ needs.java.outputs.artifact-name }}
          path: out
      - uses: actions/download-artifact@v8
        with:
          name: ${{ needs.winforms.outputs.artifact-name }}
          path: out
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mv out/contract-specs-api.jar "out/contract-specs-api-${{ needs.meta.outputs.version }}.jar"
          gh release create "$GITHUB_REF_NAME" out/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes

  download-site:
    needs: [meta, winforms, github-release]
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.DOWNLOAD_SITE_URL }}
    permissions:
      id-token: write
      contents: read
    env:
      VERSION: ${{ needs.meta.outputs.version }}
      SA: ${{ vars.STORAGE_ACCOUNT }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: ${{ needs.winforms.outputs.artifact-name }}
          path: site/releases/${{ needs.meta.outputs.version }}

      - name: Build a tiny download page
        run: |
          mkdir -p site/latest
          cp "site/releases/$VERSION/PositionSizer-$VERSION.zip" site/latest/PositionSizer.zip
          printf '{"version":"%s","published":"%s"}\n' "$VERSION" "$(date -u +%FT%TZ)" > site/version.json
          cat > site/index.html <<HTML
          <!doctype html><meta charset="utf-8"><title>Position Sizer downloads</title>
          <h1>Position Sizer $VERSION</h1>
          <p><a href="latest/PositionSizer.zip">Download latest (.zip, Windows x64, needs .NET 10 Desktop Runtime)</a></p>
          <p><a href="releases/$VERSION/PositionSizer-$VERSION.zip">This version</a> · built by run ${{ github.run_number }}</p>
          HTML

      - uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Upload to the static website container
        run: |
          az storage blob upload-batch \
            --account-name "$SA" --auth-mode login \
            --destination '$web' --source site --overwrite \
            --output none
          echo "Published: ${{ vars.DOWNLOAD_SITE_URL }}" >> "$GITHUB_STEP_SUMMARY"
