# Day 3 · Lab 1 — run Ansible from your laptop (WSL/Linux/macOS) before automating it
# cp hosts.example.ini hosts.ini and put your VM's public IP below
[linux_api]
vm-gha-linux ansible_host=20.0.0.10 ansible_user=azureuser ansible_ssh_private_key_file=~/.ssh/gha_deploy

[windows_desktop]
vm-gha-win ansible_host=20.0.0.11 ansible_user=azureuser ansible_connection=ssh ansible_shell_type=powershell ansible_ssh_private_key_file=~/.ssh/gha_deploy
