---
# Day 3 · Lab 1 — "can the delivery truck reach the house?"
- name: Check the VM is reachable and gather facts
  hosts: all
  gather_facts: true
  tasks:
    - name: Show what Ansible learned about the machine
      ansible.builtin.debug:
        msg: >-
          {{ inventory_hostname }} runs {{ ansible_facts['distribution'] }}
          {{ ansible_facts['distribution_version'] }} with {{ ansible_facts['memtotal_mb'] }} MB RAM
