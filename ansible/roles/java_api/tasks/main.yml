---
- name: Install the Java runtime
  ansible.builtin.apt:
    name: "{{ java_api_java_package }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Create a service account with no login shell
  ansible.builtin.user:
    name: "{{ java_api_app_user }}"
    system: true
    shell: /usr/sbin/nologin
    create_home: false

- name: Create release folders
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ java_api_app_user }}"
    group: "{{ java_api_app_user }}"
    mode: "0755"
  loop:
    - "{{ java_api_app_base_dir }}"
    - "{{ java_api_app_base_dir }}/releases"

- name: Upload this version of the jar
  ansible.builtin.copy:
    src: "{{ java_api_jar_src }}"
    dest: "{{ java_api_app_base_dir }}/releases/{{ java_api_app_version }}.jar"
    owner: "{{ java_api_app_user }}"
    group: "{{ java_api_app_user }}"
    mode: "0644"

- name: Point 'current' at the new version
  ansible.builtin.file:
    src: "{{ java_api_app_base_dir }}/releases/{{ java_api_app_version }}.jar"
    dest: "{{ java_api_app_base_dir }}/current.jar"
    state: link
    owner: "{{ java_api_app_user }}"
    group: "{{ java_api_app_user }}"
  notify: Restart app

- name: Install the systemd unit
  ansible.builtin.template:
    src: app.service.j2
    dest: "/etc/systemd/system/{{ java_api_app_name }}.service"
    mode: "0644"
  notify: Restart app

- name: Enable and start the service
  ansible.builtin.systemd_service:
    name: "{{ java_api_app_name }}"
    enabled: true
    state: started
    daemon_reload: true

- name: Apply pending restarts now, before we test
  ansible.builtin.meta: flush_handlers

- name: Wait for the port to open
  ansible.builtin.wait_for:
    port: "{{ java_api_app_port }}"
    timeout: 60

- name: Health check from inside the VM
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ java_api_app_port }}/health"
    return_content: true
  register: java_api_health
  retries: 10
  delay: 3
  until: java_api_health.status == 200 and (java_api_app_version in java_api_health.content)

- name: Find old releases
  ansible.builtin.find:
    paths: "{{ java_api_app_base_dir }}/releases"
    patterns: "*.jar"
  register: java_api_old_releases

- name: Keep only the newest releases
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ (java_api_old_releases.files | sort(attribute='mtime', reverse=true))[java_api_releases_to_keep:] }}"
  loop_control:
    label: "{{ item.path | basename }}"
